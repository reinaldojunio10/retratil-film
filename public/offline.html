<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Sem conexão · Retrátil Film</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafaf9; color: #0a0a0a;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 24px; box-sizing: border-box; }
  .box { max-width: 360px; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 12px; background: #0a0a0a; color: #fff; display: grid; place-items: center; font-weight: 900; letter-spacing: -1px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #78716c; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #0a0a0a; color: #fff; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">RF</div>
    <h1>Você está sem conexão</h1>
    <p>Por segurança, os dados da Retrátil Film não ficam salvos no aparelho. Conecte-se à internet para continuar.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
